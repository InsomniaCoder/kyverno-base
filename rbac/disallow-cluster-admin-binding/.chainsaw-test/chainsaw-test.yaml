apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-cluster-admin-binding
spec:
  steps:
    - name: 01 - Apply policy
      try:
        - apply:
            file: ../policy.yaml
    - name: 02 - Wait for policy to be ready
      try:
        - assert:
            resource:
              apiVersion: kyverno.io/v1
              kind: ClusterPolicy
              metadata:
                name: disallow-cluster-admin-binding
              status:
                conditions:
                  - reason: Succeeded
                    status: "True"
                    type: Ready
    - name: 03 - Binding to non-admin role should be admitted
      try:
        - apply:
            file: valid-binding.yaml
            expect:
              - check:
                  ($error == null): true
    - name: 04 - Binding to cluster-admin should be blocked
      try:
        - apply:
            file: invalid-cluster-admin-binding.yaml
            expect:
              - check:
                  ($error != null): true
