apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-standard-labels
spec:
  steps:
    - name: 01 - Apply policy
      try:
        - apply:
            file: ../policy.yaml
    - name: 02 - Wait for policy to be ready
      try:
        - assert:
            resource:
              apiVersion: kyverno.io/v1
              kind: ClusterPolicy
              metadata:
                name: require-standard-labels
              status:
                conditions:
                  - reason: Succeeded
                    status: "True"
                    type: Ready
    - name: 03 - Pod with required labels should be admitted
      try:
        - apply:
            file: valid-pod.yaml
            expect:
              - check:
                  ($error == null): true
    - name: 04 - Pod without any labels should be blocked
      try:
        - apply:
            file: invalid-no-labels.yaml
            expect:
              - check:
                  ($error != null): true
    - name: 05 - Pod missing app.kubernetes.io/version should be blocked
      try:
        - apply:
            file: invalid-missing-version.yaml
            expect:
              - check:
                  ($error != null): true
