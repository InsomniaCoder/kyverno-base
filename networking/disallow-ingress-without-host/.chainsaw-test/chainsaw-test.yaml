apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-ingress-without-host
spec:
  steps:
    - name: 01 - Apply policy
      try:
        - apply:
            file: ../policy.yaml
    - name: 02 - Wait for policy to be ready
      try:
        - assert:
            resource:
              apiVersion: kyverno.io/v1
              kind: ClusterPolicy
              metadata:
                name: disallow-ingress-without-host
              status:
                conditions:
                  - reason: Succeeded
                    status: "True"
                    type: Ready
    - name: 03 - Ingress with host should be admitted
      try:
        - apply:
            file: valid-ingress.yaml
            expect:
              - check:
                  ($error == null): true
    - name: 04 - Ingress without host field should be blocked
      try:
        - apply:
            file: invalid-no-host.yaml
            expect:
              - check:
                  ($error != null): true
    - name: 05 - Ingress with blank host should be blocked
      try:
        - apply:
            file: invalid-blank-host.yaml
            expect:
              - check:
                  ($error != null): true
